name: Bug report
description: Something does not work as documented.
title: '[Bug] '
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here; see SECURITY.md. Remove credentials, hostnames and message payloads from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Product version
      description: Release tag, or commit SHA for a build from source.
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: How do you run it?
      options:
        - Container (local web)
        - Desktop (Windows)
        - Desktop (Linux)
        - Desktop (macOS)
        - Team server
        - From source
    validations:
      required: true
  - type: input
    id: rabbitmq
    attributes:
      label: RabbitMQ version and provider
      placeholder: '4.2.9, self-managed'
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics bundle
      description: Redacted. Rendered as code.
      render: text
