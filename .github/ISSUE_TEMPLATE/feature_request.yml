name: Feature request
description: Propose a capability or an improvement.
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way? Describe the problem before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Use Given/When/Then where you can; it becomes the acceptance criteria.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine
        - UI
        - Container / packaging
        - Desktop
        - Team server
        - Messages (peek, tap, DLQ)
        - Topology / admin
        - Metrics
        - Docs
        - Other
  - type: checkboxes
    id: terms
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues.
          required: true
        - label: This does not require telemetry or a paid tier (the project is fully open source and local-first).
          required: true
