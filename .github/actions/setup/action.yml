# Shared workspace setup (M0-05): pnpm from `packageManager`, Node from `.nvmrc`, frozen install.
# Call it after actions/checkout. Every `uses:` here is pinned by full SHA (`nx run supply-chain:actions-pinned`).
# `node-version` (M0-42) is for the nightly conformance run on a second, exact Node (26.12.0); when it
# is empty, which is every other caller, Node comes from `.nvmrc` as before. The two inputs of
# setup-node are never both set.
name: setup
description: Install pnpm and Node from the repository pins and run a frozen-lockfile install.

inputs:
  node-version:
    description: Exact Node version (for example 26.12.0) to use instead of the one in .nvmrc. Empty means .nvmrc.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
