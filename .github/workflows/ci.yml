# M0-05 CI skeleton: setup -> supply-chain gates -> nx affected -t lint typecheck test build.
# Replaces the M0-01 toolchain-proof workflow: the `toolchain` job keeps its three-OS
# build/test/typecheck proof and `pnpm why typescript`.
#
# Runners:
#   - gates   : three OSes (the licence gate only sees packages installed on the current OS).
#   - affected: Linux only.
#   - toolchain: three OSes. macOS minutes cost the most, so macOS runs on push to main and manual
#     runs only; pull requests run Linux and Windows.
# Every action is pinned by full SHA; the pin is checked by `nx run supply-chain:actions-pinned`.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel runs on main: nx-set-shas uses the last successful run as the affected base.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04","windows-2025"]' || '["ubuntu-24.04","windows-2025","macos-15"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Supply-chain gates (lockfile, pins, allow-list, licences)
        run: pnpm nx run supply-chain:gates
      - name: Actions are pinned by full SHA
        run: pnpm nx run supply-chain:actions-pinned
      - name: Feature and work-item graph (dangling, cyclic, forward dependencies)
        run: pnpm nx run work-graph:validate
      # M0-36: the built engine bundle as a process: local and desktop mode start, the data-dir lock
      # refuses a second engine, team mode refuses, and the metafile lists every bundled package.
      - name: Engine bundle smoke
        run: pnpm nx run engine:smoke
      - name: Gates self-tests (planted violations)
        if: runner.os == 'Linux'
        run: |
          pnpm nx run-many -t gates-selftest actions-pinned-selftest workflow-hardening-selftest conformance-workflows-selftest -p supply-chain
          pnpm nx run work-graph:test

  affected:
    name: affected
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # nx-set-shas reads the last successful run of this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          workflow-id: ci.yml
      - run: pnpm nx affected -t lint typecheck test build
      # M0-25: the golden fixtures of the management client replayed (no broker needed).
      - run: pnpm nx affected -t test-golden
      # Issue #277: the production web build, served by the real engine bundle, renders styled in
      # Chrome under the real CSP, with no CSP or Trusted Types report. A missing browser fails.
      - run: pnpm nx run web-csp-check:csp-check
        env:
          CSP_CHECK_REQUIRE_BROWSER: '1'
      # Drift gate: regenerate the specs from the contract registry and fail on any difference.
      - run: pnpm nx run contracts:api-docs-check

  # M0-21: the same migrations and repository tests on SQLite and on Postgres 16 and 18. The
  # Postgres containers are started with the Docker daemon of the hosted Linux runner.
  persistence-it:
    name: persistence integration (sqlite, postgres 16 and 18)
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm nx run persistence:it --dialects=sqlite,pg

  # M0-28: the AMQP 0-9-1 contract suite, once per client library (amqplib and
  # @cloudamqp/amqp-client), against each of the five lab brokers. The brokers are started with the
  # Docker daemon of the hosted Linux runner; the recorded observations (for example the nack after
  # a server-initiated cancel) are kept as an artifact for the lab-evidence review (I-14).
  amqp091-contract:
    name: AMQP 0-9-1 contract (two client libraries, five brokers)
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm nx run adapter-amqp091:contract --broker=all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contract-evidence
          path: dist/contract-evidence
          if-no-files-found: ignore
          retention-days: 30

  # M0-15: the evidence recorder and the raw lab drivers against a real lab broker (RabbitMQ 4.3.6).
  # The run is not the `conformance-record` workflow (M0-71), so its artefact is stamped `local`: it
  # is kept for review as a build artifact and is never written to testing/lab-evidence (A-20).
  conformance-record:
    name: conformance record (CF-SMOKE-01 on 4.3.6)
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm nx run conformance:it --versions=4.3.6
      # M0-37: the three-way assertion with its live leg on a real broker. CF-SMOKE-01 has no recorded
      # evidence yet, so it reports `unverified` (shown, never green); a recorded artefact that the
      # live run contradicts fails with a field-level diff.
      - run: pnpm nx run conformance:test --grep=CF-SMOKE --versions=4.3.6
      - run: pnpm nx run conformance:record --cells=CF-SMOKE-01 --versions=4.3.6 --out=dist/conformance-record
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-record-local
          path: dist/conformance-record
          if-no-files-found: ignore
          retention-days: 7

  # M0-37: invariant I-14 on the change under test (the push range, or the pull request against its
  # base). A registry cell's status or effect may change only with valid lab evidence recorded by
  # conformance-record.yml; every evidence file must verify, carry a CI stamp and trace to a
  # successful run of that workflow (checked through the GitHub API with the job's token). The
  # coverage gate then shows which cells the recorded evidence confirms.
  semantics-evidence:
    name: semantics evidence (I-14)
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the check asks the API about the run behind each evidence stamp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Base of the change
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          fi
      - name: Status and effect changes need valid, CI-recorded evidence
        env:
          BASE: ${{ steps.base.outputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm nx run semantics-evidence:check --base="$BASE"
      - run: pnpm nx run semantics:audit-cells
      - run: pnpm nx run conformance:coverage

  toolchain:
    name: toolchain (${{ matrix.os }})
    needs: gates
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04","windows-2025"]' || '["ubuntu-24.04","windows-2025","macos-15"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm why typescript
      - run: pnpm nx run-many -t build test typecheck
