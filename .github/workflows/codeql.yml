# M0-05: CodeQL for the TypeScript code base (blueprint 7.6).
#
# Code scanning needs GitHub Advanced Security on a private repository, and this repository is
# private without it. The job is therefore skipped (it reports as skipped, which satisfies a
# required check) until the repository is public or the repository variable GHAS_ENABLED is set
# to 'true' (Settings > Secrets and variables > Actions > Variables). See OQ-41.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql
    if: github.event.repository.private == false || vars.GHAS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript
