# M0-64 container image (PLAT-09): build, test and scan on every change under packaging/docker; on a
# release tag (or a manual run with publish) push a multi-architecture image, sign it keyless with
# cosign and verify the signature. Every action is pinned by full SHA (`nx run supply-chain:actions-pinned`).
#
# Jobs:
#   verify   native amd64 and arm64 runners: build the image, run the docker test suite against it
#            (non-root, read-only root filesystem, SIGTERM within 2 s, ...) and scan it with Trivy.
#            Fails on any CRITICAL vulnerability. Needs no registry and no secret.
#   push     (publish only) the same build, pushed by digest, with SBOM and provenance attestations.
#   merge    (publish only) one manifest list from the two digests, tagged; cosign keyless signature
#            (the only job with id-token: write); verifies the signature and that both platforms are in.
#
# Nothing is published until a maintainer sets the repository variable IMAGE_NAME (the image name
# under ghcr.io/<owner>/): the product name is pending (ADR-029, amendment A-22). This workflow
# never picks a name, and a package it pushes starts private until a maintainer changes that.
name: image

on:
  push:
    branches: [main]
    paths:
      - 'packaging/docker/**'
      - '.github/workflows/image.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/docker/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push, sign and verify the image (needs the IMAGE_NAME repository variable; main or a tag only)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  LOCAL_TAG: product-local

jobs:
  verify:
    name: verify (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image for this runner and load it into the daemon
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          load: true
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Docker tests (static checks and the live container run)
        env:
          DOCKER_REQUIRE: '1'
          DOCKER_IMAGE: ${{ env.LOCAL_TAG }}
        run: node --test packaging/docker/dockerfile.test.mjs packaging/docker/image.live.test.mjs
      - name: Trivy (fails on any CRITICAL vulnerability or secret)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: '1'
          format: table

  push:
    name: push (${{ matrix.arch }})
    needs: verify
    # Publishing needs the repository variable (no name is invented) and a release tag or main.
    if: >-
      vars.IMAGE_NAME != '' &&
      (github.event_name == 'push' && github.ref_type == 'tag' ||
       github.event_name == 'workflow_dispatch' && inputs.publish && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image reference (ghcr.io wants lower case)
        run: echo "IMAGE=ghcr.io/${OWNER,,}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest, with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Keep the digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge, sign and verify
    needs: push
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless: the one job that may ask for an OIDC token
    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      OWNER: ${{ github.repository_owner }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Image reference (ghcr.io wants lower case)
        run: echo "IMAGE=ghcr.io/${OWNER,,}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: One manifest list from the two digests
        working-directory: ${{ runner.temp }}/digests
        run: |
          # The tag arguments are word-split on purpose (one -t per tag).
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Digest of the manifest list, and both platforms present
        id: index
        env:
          FIRST_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          digest="$(docker buildx imagetools inspect "${FIRST_TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
          platforms="$(docker buildx imagetools inspect "${FIRST_TAG}" --raw | jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")')"
          if [ "${platforms}" != "amd64,arm64" ]; then
            echo "expected linux/amd64 and linux/arm64, found: ${platforms}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the manifest list (keyless)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the signature against this workflow's identity
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github\.com/${REPOSITORY}/\.github/workflows/image\.yml@" \
            "${IMAGE}@${DIGEST}"
