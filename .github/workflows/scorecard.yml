# M0-05: OpenSSF Scorecard (blueprint 7.6).
#
# Results are not published (`publish_results: false`) while the repository is private and the name
# is uncleared (ADR-029, A-22). The SARIF is kept as a workflow artifact; uploading it to code
# scanning needs GitHub Advanced Security, so that step runs only when the repository is public or
# GHAS_ENABLED is 'true' (OQ-41). Switch `publish_results` on (and add `id-token: write`) when the
# repository goes public.
name: scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14
      - name: Upload to code scanning
        if: github.event.repository.private == false || vars.GHAS_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard
