# M0-05: static analysis of the workflows themselves (template injection, excessive permissions,
# unpinned actions, credential persistence). Rules are configured in .github/zizmor.yml.
# Findings are printed to the job log; uploading SARIF to code scanning would need GitHub Advanced
# Security (OQ-41), so `advanced-security` is off.
name: zizmor

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
          persona: regular
