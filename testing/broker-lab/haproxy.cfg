# HAProxy in front of the three brokers (M0-14). Plain TCP everywhere, so the lab sees the broker's
# own protocol behaviour. Backends tolerate a node that is down at start-up (init-addr none).

global
    log stdout format raw local0

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 120s
    timeout server 120s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

frontend amqp
    bind *:5672
    default_backend amqp_nodes

frontend management
    bind *:15672
    default_backend management_nodes

frontend prometheus
    bind *:15692
    default_backend prometheus_nodes

backend amqp_nodes
    balance roundrobin
    default-server inter 2s fall 3 rise 1 resolvers docker init-addr none
    server rmq1 rmq1:5672 check
    server rmq2 rmq2:5672 check
    server rmq3 rmq3:5672 check

backend management_nodes
    balance roundrobin
    default-server inter 2s fall 3 rise 1 resolvers docker init-addr none
    server rmq1 rmq1:15672 check
    server rmq2 rmq2:15672 check
    server rmq3 rmq3:15672 check

backend prometheus_nodes
    balance roundrobin
    default-server inter 2s fall 3 rise 1 resolvers docker init-addr none
    server rmq1 rmq1:15692 check
    server rmq2 rmq2:15692 check
    server rmq3 rmq3:15692 check
