# OAuth variant (M0-14): the oauth2 backend validates JWTs signed with a lab key, with the internal
# backend as the fallback so `guest` still works for the verify checks. The key pair is generated for
# every run; the startBroker helper copies the public key to /etc/rabbitmq/oauth and returns the
# private key so a test can mint tokens. Keycloak itself belongs to the team-server E2E (M3).

auth_backends.1 = oauth2
auth_backends.2 = internal

auth_oauth2.resource_server_id = rabbitmq
auth_oauth2.default_key = lab-key
auth_oauth2.signing_keys.lab-key = /etc/rabbitmq/oauth/lab-key.pem
