# Cluster variant (M0-14): three nodes that find each other by a fixed peer list. Mounted into
# /etc/rabbitmq/conf.d by compose.3node.yaml. Node names follow the compose hostnames.
# No randomized start-up delay keys: 4.3 does not know them, and one file serves every version.

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rmq1
cluster_formation.classic_config.nodes.2 = rabbit@rmq2
cluster_formation.classic_config.nodes.3 = rabbit@rmq3
