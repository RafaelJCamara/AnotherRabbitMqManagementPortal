# Broker-lab configuration (M0-14), loaded after the image defaults (conf.d/10-defaults.conf).
# One file for every supported version (3.13.7 to 4.3.6): it uses only keys that all of them know.
# The advertised stream address depends on the host port, so it is set at run time
# (a stream.advertised_* fragment in conf.d), never here.

loopback_users.guest = false

listeners.tcp.default = 5672
management.tcp.port = 15672
prometheus.tcp.port = 15692
stream.listeners.tcp.default = 5552

# A small disk on a CI runner must not trip the disk alarm and block publishers mid-experiment.
disk_free_limit.absolute = 64MB

log.console = true
log.console.level = info
