# TLS variant (M0-14): AMQP 5671, management 15671 and stream 5551 next to the plain listeners.
# The certificate and key are generated for every run (tls/ holds no key material) and copied to
# /etc/rabbitmq/tls by the startBroker helper. Clients trust the certificate itself (it is its own
# CA) and verify the name `localhost` or the address 127.0.0.1.

listeners.ssl.default = 5671
stream.listeners.ssl.default = 5551
management.ssl.port = 15671

ssl_options.cacertfile = /etc/rabbitmq/tls/ca.pem
ssl_options.certfile = /etc/rabbitmq/tls/server.pem
ssl_options.keyfile = /etc/rabbitmq/tls/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

management.ssl.cacertfile = /etc/rabbitmq/tls/ca.pem
management.ssl.certfile = /etc/rabbitmq/tls/server.pem
management.ssl.keyfile = /etc/rabbitmq/tls/server.key
